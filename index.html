<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CookApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; margin: 0; padding: 16px; color: #333; }
        .card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .balance { font-size: 28px; font-weight: bold; color: #ff9800; }
        .limit { font-size: 18px; color: #666; }
        .btn { display: block; width: 100%; padding: 14px; margin: 8px 0; border: none; border-radius: 12px; font-size: 18px; font-weight: 600; background: #4CAF50; color: white; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn:active { transform: scale(0.96); }
        .btn-secondary { background: #2196F3; }
        .btn-warning { background: #ff9800; }
        .btn-danger { background: #f44336; }
        .btn-outline { background: transparent; color: #333; border: 2px solid #ddd; }
    </style>
</head>
<body>
    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div><div style="font-size:14px;color:#888;">Баланс</div><div class="balance" id="balance">0 ⭐</div></div>
            <div><div style="font-size:14px;color:#888;">Лимит сегодня</div><div class="limit" id="limit">0 / 3</div></div>
        </div>
    </div>

    <button class="btn" id="fridgeBtn">📸 Фото холодильника</button>
    <button class="btn btn-secondary" id="cookedBtn">🍳 Готовое блюдо</button>
    <button class="btn btn-warning" id="buyStarsBtn">⭐ Купить звёзды</button>
    <button class="btn btn-danger" id="subscribeBtn">📈 Подписка</button>
    <button class="btn btn-outline" id="historyBtn">📋 Мои рецепты</button>

    <div class="card" style="margin-top:20px;font-size:14px;color:#999;text-align:center;">
        <p>CookApp — готовьте и получайте звёзды!</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        document.getElementById('fridgeBtn').onclick = () => tg.sendData('fridge_photo');
        document.getElementById('cookedBtn').onclick = () => tg.sendData('cooked_photo');
        document.getElementById('buyStarsBtn').onclick = () => tg.sendData('buy_stars');
        document.getElementById('subscribeBtn').onclick = () => tg.sendData('subscribe');
        document.getElementById('historyBtn').onclick = () => tg.sendData('my_recipes');

        function updateUI(balance, used, limit) {
            document.getElementById('balance').innerText = balance + ' ⭐';
            document.getElementById('limit').innerText = used + ' / ' + limit;
        }
    </script>
</body>
</html>
