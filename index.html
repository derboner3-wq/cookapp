<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Кошелёк</title>
    <style>
        :root {
            --tg-theme-bg: #ffffff;
            --tg-theme-text: #1a1a1a;
            --tg-theme-hint: #8e8e93;
            --tg-theme-link: #007aff;
            --tg-theme-button: #007aff;
            --tg-theme-button-text: #ffffff;
            --tg-theme-secondary-bg: #f2f2f7;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg);
            color: var(--tg-theme-text);
            padding: 16px;
            max-width: 400px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--tg-theme-secondary-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .greeting {
            font-size: 14px;
            color: var(--tg-theme-hint);
        }
        .balance-card {
            background: linear-gradient(135deg, #007aff, #00c6ff);
            border-radius: 16px;
            padding: 20px;
            color: white;
            margin-bottom: 24px;
        }
        .balance-label { font-size: 14px; opacity: 0.9; }
        .balance-amount { font-size: 32px; font-weight: bold; margin-top: 4px; }
        .balance-limit { font-size: 14px; opacity: 0.8; margin-top: 4px; }
        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:active { opacity: 0.8; }
        .btn-primary {
            background: var(--tg-theme-button);
            color: var(--tg-theme-button-text);
        }
        .btn-secondary {
            background: var(--tg-theme-secondary-bg);
            color: var(--tg-theme-text);
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .transaction-list {
            list-style: none;
        }
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid var(--tg-theme-secondary-bg);
        }
        .transaction-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .transaction-emoji {
            font-size: 24px;
        }
        .transaction-info {
            display: flex;
            flex-direction: column;
        }
        .transaction-category {
            font-size: 16px;
            font-weight: 500;
        }
        .transaction-date {
            font-size: 13px;
            color: var(--tg-theme-hint);
        }
        .transaction-amount {
            font-weight: 600;
        }
        .empty-state {
            text-align: center;
            color: var(--tg-theme-hint);
            padding: 40px 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <div class="greeting">Привет,</div>
            <div id="userName">...</div>
        </div>
        <div class="avatar" id="userAvatar">👤</div>
    </div>

    <div class="balance-card">
        <div class="balance-label">Остаток на месяц</div>
        <div class="balance-amount" id="balanceDisplay">0 ₽</div>
        <div class="balance-limit" id="dailyLimit">Дневной лимит: не задан</div>
    </div>

    <div class="actions">
        <button class="btn btn-primary" id="addExpenseBtn">➖ Добавить расход</button>
        <button class="btn btn-secondary" id="addIncomeBtn">➕ Добавить доход</button>
    </div>

    <div class="section-title">Последние операции</div>
    <ul class="transaction-list" id="transactionList">
        <li class="empty-state">Нет записей</li>
    </ul>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand(); // раскрыть на полный экран

        // Применяем тему Telegram
        document.documentElement.style.setProperty('--tg-theme-bg', tg.backgroundColor);
        document.documentElement.style.setProperty('--tg-theme-text', tg.textColor);
        document.documentElement.style.setProperty('--tg-theme-hint', tg.hintColor);
        document.documentElement.style.setProperty('--tg-theme-link', tg.linkColor);
        document.documentElement.style.setProperty('--tg-theme-button', tg.buttonColor);
        document.documentElement.style.setProperty('--tg-theme-button-text', tg.buttonTextColor);
        document.documentElement.style.setProperty('--tg-theme-secondary-bg', tg.secondaryBackgroundColor);

        // Отображаем имя пользователя
        const userName = tg.initDataUnsafe?.user?.first_name || 'Гость';
        document.getElementById('userName').textContent = userName;
        document.getElementById('userAvatar').textContent = userName.charAt(0).toUpperCase();

        // Ключи для CloudStorage
        const STORAGE_KEY_BALANCE = 'wallet_balance';
        const STORAGE_KEY_TRANSACTIONS = 'wallet_transactions';

        // Текущие данные в памяти
        let balance = 0;
        let transactions = [];

        // Загрузка из облака
        async function loadData() {
            try {
                const [savedBalance, savedTransactions] = await Promise.all([
                    getCloudValue(STORAGE_KEY_BALANCE),
                    getCloudValue(STORAGE_KEY_TRANSACTIONS)
                ]);
                if (savedBalance !== null) balance = Number(savedBalance);
                if (savedTransactions) transactions = JSON.parse(savedTransactions);
                updateUI();
            } catch (e) {
                console.error('Ошибка загрузки:', e);
                updateUI(); // показать хотя бы дефолтные значения
            }
        }

        function getCloudValue(key) {
            return new Promise((resolve) => {
                tg.CloudStorage.getItem(key, (err, value) => {
                    if (err) resolve(null);
                    else resolve(value);
                });
            });
        }

        function setCloudValue(key, value) {
            return new Promise((resolve) => {
                tg.CloudStorage.setItem(key, String(value), (err, success) => {
                    if (err) console.error(err);
                    resolve(success);
                });
            });
        }

        // Сохранение всех данных
        async function saveData() {
            await Promise.all([
                setCloudValue(STORAGE_KEY_BALANCE, balance),
                setCloudValue(STORAGE_KEY_TRANSACTIONS, JSON.stringify(transactions))
            ]);
        }

        // Добавление демо-расхода (потом заменим на полноценную форму)
        async function addTestExpense() {
            const category = '🍕 Еда';
            const amount = 350;
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

            transactions.unshift({
                id: Date.now(),
                type: 'expense',
                category,
                amount,
                date: dateStr,
                emoji: '🍕'
            });

            balance -= amount;
            await saveData();
            updateUI();
        }

        // Простая заглушка для дохода
        async function addTestIncome() {
            const category = '💼 Зарплата';
            const amount = 5000;
            const now = new Date();
            const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

            transactions.unshift({
                id: Date.now(),
                type: 'income',
                category,
                amount,
                date: dateStr,
                emoji: '💼'
            });

            balance += amount;
            await saveData();
            updateUI();
        }

        // Обновление интерфейса
        function updateUI() {
            document.getElementById('balanceDisplay').textContent = balance.toLocaleString() + ' ₽';
            // Дневной лимит можно рассчитать позже
            const list = document.getElementById('transactionList');
            list.innerHTML = '';
            if (transactions.length === 0) {
                list.innerHTML = '<li class="empty-state">Нет записей</li>';
                return;
            }
            transactions.slice(0, 10).forEach(tx => {
                const li = document.createElement('li');
                li.className = 'transaction-item';
                li.innerHTML = `
                    <div class="transaction-left">
                        <span class="transaction-emoji">${tx.emoji}</span>
                        <div class="transaction-info">
                            <span class="transaction-category">${tx.category}</span>
                            <span class="transaction-date">${tx.date}</span>
                        </div>
                    </div>
                    <span class="transaction-amount" style="color: ${tx.type === 'income' ? '#34c759' : '#ff3b30'}">
                        ${tx.type === 'income' ? '+' : '-'}${tx.amount} ₽
                    </span>
                `;
                list.appendChild(li);
            });
        }

        // Привязка кнопок
        document.getElementById('addExpenseBtn').addEventListener('click', addTestExpense);
        document.getElementById('addIncomeBtn').addEventListener('click', addTestIncome);

        // Старт
        loadData();
    </script>
</body>
</html>
