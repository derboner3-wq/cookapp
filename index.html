<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 CookApp</title>
    <style>
        body { font-family: system-ui; background: #f7f3ee; padding: 20px; display: flex; justify-content: center; }
        .container { max-width: 500px; width: 100%; background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; }
        .stars { font-size: 24px; color: #f5b342; }
        .limit { color: #888; margin-bottom: 20px; }
        .upload-area { border: 2px dashed #ddd; border-radius: 20px; padding: 30px; text-align: center; cursor: pointer; }
        .upload-area img { max-width: 100%; max-height: 250px; margin-top: 10px; display: none; }
        .btn { background: #f5b342; color: white; border: none; padding: 14px; border-radius: 40px; font-size: 18px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 10px; }
        .btn:disabled { background: #ccc; }
        .result { margin-top: 20px; background: #faf6f0; border-radius: 20px; padding: 20px; display: none; }
        .recipe { background: white; border-radius: 15px; padding: 15px; margin-top: 10px; }
        .error { color: #d32f2f; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🍳 CookApp</h1>
    <div class="stars" id="starsDisplay">⭐ 0</div>
    <div class="limit">📸 Сегодня: <span id="usedCount">0</span> / 3</div>

    <div class="upload-area" id="uploadArea">
        <p>📸 Нажми, чтобы выбрать фото</p>
        <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none;">
        <img id="preview" />
    </div>
    <button class="btn" id="recognizeBtn" disabled>🔍 Распознать</button>

    <div class="result" id="resultBox">
        <div id="productTitle" style="font-size:22px; font-weight:700;"></div>
        <div id="recipesContainer"></div>
    </div>
    <div id="errorMessage" class="error"></div>
</div>

<script>
    const photoInput = document.getElementById('photoInput');
    const uploadArea = document.getElementById('uploadArea');
    const preview = document.getElementById('preview');
    const recognizeBtn = document.getElementById('recognizeBtn');
    const resultBox = document.getElementById('resultBox');
    const productTitle = document.getElementById('productTitle');
    const recipesContainer = document.getElementById('recipesContainer');
    const errorMsg = document.getElementById('errorMessage');
    const starsDisplay = document.getElementById('starsDisplay');
    const usedCount = document.getElementById('usedCount');

    let currentImageBase64 = null;

    uploadArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            preview.src = dataUrl;
            preview.style.display = 'block';
            currentImageBase64 = dataUrl.split(',')[1];
            recognizeBtn.disabled = false;
            errorMsg.textContent = '';
            resultBox.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    recognizeBtn.addEventListener('click', async () => {
        if (!currentImageBase64) return;
        recognizeBtn.disabled = true;
        recognizeBtn.textContent = '⏳ ...';
        errorMsg.textContent = '';
        resultBox.style.display = 'none';

        try {
            const response = await fetch('/recognize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: currentImageBase64 })
            });
            const data = await response.json();

            if (!response.ok) {
                errorMsg.textContent = '❌ ' + (data.error || 'Ошибка');
                return;
            }

            productTitle.textContent = '🍽 ' + data.product;
            recipesContainer.innerHTML = '';
            data.recipes.forEach(r => {
                const div = document.createElement('div');
                div.className = 'recipe';
                div.innerHTML = `<h3>${r.name}</h3><p>${r.instructions}</p>`;
                recipesContainer.appendChild(div);
            });
            starsDisplay.textContent = '⭐ ' + data.stars;
            usedCount.textContent = data.today_used;
            resultBox.style.display = 'block';
        } catch (err) {
            errorMsg.textContent = '❌ ' + err.message;
        } finally {
            recognizeBtn.disabled = false;
            recognizeBtn.textContent = '🔍 Распознать';
        }
    });
</script>
</body>
</html>
