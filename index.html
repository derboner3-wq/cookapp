<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍳 CookApp</title>
    <style>
        body { font-family: system-ui; background: #f7f3ee; display: flex; justify-content: center; padding: 20px; }
        .container { max-width: 400px; width: 100%; background: white; border-radius: 30px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { font-size: 28px; }
        .stars { font-size: 24px; color: #f5b342; }
        .limit { color: #888; }
        select, .btn { width: 100%; padding: 15px; font-size: 18px; border-radius: 15px; border: 2px solid #ddd; margin: 10px 0; }
        .btn { background: #f5b342; color: white; border: none; font-weight: bold; cursor: pointer; }
        .btn:disabled { background: #ccc; }
        .result { margin-top: 20px; background: #faf6f0; border-radius: 20px; padding: 20px; display: none; }
        .recipe { background: white; border-radius: 15px; padding: 15px; margin-top: 10px; }
        .error { color: #d32f2f; margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🍳 CookApp</h1>
    <div class="stars" id="starsDisplay">⭐ 0</div>
    <div class="limit">📸 Сегодня: <span id="usedCount">0</span> / 3</div>

    <select id="productSelect">
        <option value="">-- Выберите продукт --</option>
        {% for p in products %}
            <option value="{{ p }}">{{ p }}</option>
        {% endfor %}
    </select>
    <button class="btn" id="getBtn">🔍 Получить рецепты</button>

    <div class="result" id="resultBox">
        <div id="productTitle" style="font-size:22px; font-weight:700;"></div>
        <div id="recipesContainer"></div>
    </div>
    <div id="errorMessage" class="error"></div>
</div>

<script>
    const productSelect = document.getElementById('productSelect');
    const getBtn = document.getElementById('getBtn');
    const resultBox = document.getElementById('resultBox');
    const productTitle = document.getElementById('productTitle');
    const recipesContainer = document.getElementById('recipesContainer');
    const errorMsg = document.getElementById('errorMessage');
    const starsDisplay = document.getElementById('starsDisplay');
    const usedCount = document.getElementById('usedCount');

    getBtn.addEventListener('click', async () => {
        const product = productSelect.value;
        if (!product) { errorMsg.textContent = '⚠️ Выберите продукт!'; return; }
        errorMsg.textContent = '';
        getBtn.disabled = true;
        getBtn.textContent = '⏳ ...';
        resultBox.style.display = 'none';

        try {
            const response = await fetch('/get_recipes', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product })
            });
            const data = await response.json();

            if (!response.ok) {
                errorMsg.textContent = '❌ ' + (data.error || 'Ошибка');
                return;
            }

            productTitle.textContent = '🍽 ' + data.product;
            recipesContainer.innerHTML = '';
            data.recipes.forEach(r => {
                const div = document.createElement('div');
                div.className = 'recipe';
                div.innerHTML = `<h3>${r.name}</h3><p>${r.instructions}</p>`;
                recipesContainer.appendChild(div);
            });
            starsDisplay.textContent = '⭐ ' + data.stars;
            usedCount.textContent = data.today_used;
            resultBox.style.display = 'block';
        } catch (err) {
            errorMsg.textContent = '❌ Ошибка: ' + err.message;
        } finally {
            getBtn.disabled = false;
            getBtn.textContent = '🔍 Получить рецепты';
        }
    });
</script>
</body>
</html>
