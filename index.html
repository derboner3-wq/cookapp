<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🍳 CookApp</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f7f3ee;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 30px;
            padding: 30px 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        h1 { font-size: 28px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .badge { background: #ffcc00; padding: 5px 12px; border-radius: 30px; font-size: 14px; font-weight: 600; }
        .stars { font-size: 24px; color: #f5b342; margin: 10px 0; }
        .limit { font-size: 14px; color: #888; margin-bottom: 20px; }
        .upload-area {
            border: 2px dashed #ddd;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .upload-area:hover { border-color: #f5b342; background: #fffbf0; }
        .upload-area input { display: none; }
        .upload-area img { max-width: 100%; max-height: 250px; border-radius: 15px; margin-top: 10px; }
        .btn {
            background: #f5b342;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 40px;
            font-size: 18px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 10px;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .result {
            margin-top: 25px;
            background: #faf6f0;
            border-radius: 20px;
            padding: 20px;
            display: none;
        }
        .result .product-title { font-size: 22px; font-weight: 700; margin-bottom: 15px; }
        .result .recipe {
            background: white;
            border-radius: 15px;
            padding: 15px;
            margin-top: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .recipe h3 { margin-bottom: 5px; }
        .recipe p { color: #555; line-height: 1.4; }
        .error { color: #d32f2f; margin-top: 10px; }
        .footer { margin-top: 30px; font-size: 13px; color: #aaa; text-align: center; }
        .manual-section {
            margin-top: 20px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            display: none;
        }
        .manual-section select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 15px;
            background: white;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
            cursor: pointer;
        }
        .manual-section select:focus { border-color: #f5b342; outline: none; }
        .manual-section .btn-manual {
            margin-top: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🍳 CookApp <span class="badge">Beta</span></h1>
    <div class="stars" id="starsDisplay">⭐ 0</div>
    <div class="limit">📸 Сегодня использовано: <span id="usedCount">0</span> / 3</div>

    <!-- Загрузка фото -->
    <div class="upload-area" id="uploadArea">
        <p>📸 Нажми, чтобы выбрать фото<br><small>или сфотографировать</small></p>
        <input type="file" accept="image/*" capture="environment" id="photoInput">
        <img id="preview" style="display:none;" />
    </div>
    <button class="btn" id="recognizeBtn" disabled>🔍 Распознать</button>

    <!-- Ручной выбор (появляется при ошибке распознавания) -->
    <div class="manual-section" id="manualSection">
        <p style="color:#888; margin-bottom:10px;">⚠️ Распознавание не удалось. Выберите продукт вручную:</p>
        <select id="manualProductSelect">
            <option value="">-- Выберите --</option>
            {% for p in products %}
                <option value="{{ p }}">{{ p }}</option>
            {% endfor %}
        </select>
        <button class="btn btn-manual" id="manualBtn">✅ Получить рецепты</button>
    </div>

    <!-- Результат -->
    <div class="result" id="resultBox">
        <div class="product-title" id="productTitle">🍽 ...</div>
        <div id="recipesContainer"></div>
    </div>
    <div id="errorMessage" class="error"></div>
</div>
<div class="footer">CookApp — готовьте и получайте звёзды!</div>

<script>
    const photoInput = document.getElementById('photoInput');
    const preview = document.getElementById('preview');
    const uploadArea = document.getElementById('uploadArea');
    const recognizeBtn = document.getElementById('recognizeBtn');
    const resultBox = document.getElementById('resultBox');
    const productTitle = document.getElementById('productTitle');
    const recipesContainer = document.getElementById('recipesContainer');
    const errorMsg = document.getElementById('errorMessage');
    const starsDisplay = document.getElementById('starsDisplay');
    const usedCount = document.getElementById('usedCount');
    const manualSection = document.getElementById('manualSection');
    const manualProductSelect = document.getElementById('manualProductSelect');
    const manualBtn = document.getElementById('manualBtn');

    let currentImageBase64 = null;

    // --- Загрузка фото ---
    uploadArea.addEventListener('click', () => photoInput.click());
    photoInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
            const dataUrl = ev.target.result;
            preview.src = dataUrl;
            preview.style.display = 'block';
            currentImageBase64 = dataUrl.split(',')[1];
            recognizeBtn.disabled = false;
            errorMsg.textContent = '';
            resultBox.style.display = 'none';
            manualSection.style.display = 'none';
        };
        reader.readAsDataURL(file);
    });

    // --- Распознавание по фото ---
    recognizeBtn.addEventListener('click', async () => {
        if (!currentImageBase64) return;
        recognizeBtn.disabled = true;
        recognizeBtn.textContent = '⏳ Распознаю...';
        errorMsg.textContent = '';
        resultBox.style.display = 'none';
        manualSection.style.display = 'none';

        try {
            const response = await fetch('/recognize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: currentImageBase64 })
            });
            const data = await response.json();

            if (response.status === 429) {
                errorMsg.textContent = '❌ ' + data.error;
                return;
            }
            if (response.status === 404 && data.need_manual) {
                // Показываем ручной выбор
                manualSection.style.display = 'block';
                errorMsg.textContent = '⚠️ ' + (data.error || 'Не удалось распознать, выберите вручную');
                return;
            }
            if (!response.ok) {
                errorMsg.textContent = '❌ Ошибка: ' + (data.error || 'Неизвестная ошибка');
                return;
            }

            // Успех
            productTitle.textContent = '🍽 ' + data.product;
            recipesContainer.innerHTML = '';
            data.recipes.forEach(r => {
                const div = document.createElement('div');
                div.className = 'recipe';
                div.innerHTML = `<h3>${r.name}</h3><p>${r.instructions}</p>`;
                recipesContainer.appendChild(div);
            });
            starsDisplay.textContent = '⭐ ' + data.stars;
            usedCount.textContent = data.today_used;
            resultBox.style.display = 'block';
            manualSection.style.display = 'none';
        } catch (err) {
            errorMsg.textContent = '❌ Сетевая ошибка: ' + err.message;
        } finally {
            recognizeBtn.disabled = false;
            recognizeBtn.textContent = '🔍 Распознать';
        }
    });

    // --- Ручной выбор ---
    manualBtn.addEventListener('click', async () => {
        const product = manualProductSelect.value;
        if (!product) {
            errorMsg.textContent = '⚠️ Выберите продукт!';
            return;
        }
        errorMsg.textContent = '';
        manualBtn.disabled = true;
        manualBtn.textContent = '⏳ ...';

        try {
            const response = await fetch('/get_recipes_manual', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product: product })
            });
            const data = await response.json();

            if (response.status === 429) {
                errorMsg.textContent = '❌ ' + data.error;
                return;
            }
            if (!response.ok) {
                errorMsg.textContent = '❌ ' + data.error;
                return;
            }

            productTitle.textContent = '🍽 ' + data.product;
            recipesContainer.innerHTML = '';
            data.recipes.forEach(r => {
                const div = document.createElement('div');
                div.className = 'recipe';
                div.innerHTML = `<h3>${r.name}</h3><p>${r.instructions}</p>`;
                recipesContainer.appendChild(div);
            });
            starsDisplay.textContent = '⭐ ' + data.stars;
            usedCount.textContent = data.today_used;
            resultBox.style.display = 'block';
            manualSection.style.display = 'none';
        } catch (err) {
            errorMsg.textContent = '❌ Ошибка: ' + err.message;
        } finally {
            manualBtn.disabled = false;
            manualBtn.textContent = '✅ Получить рецепты';
        }
    });
</script>
</body>
</html>
