<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кулинарная Игра</title>
    <!-- Подключаем официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #f0f0f0);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .stars {
            font-size: 24px;
            color: #ffca28;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>🍳 Кулинарная Арена</h2>
    
    <div class="card">
        <p>Привет, <span id="username">Повар</span>!</p>
        <div class="stars">⭐ <span id="star-count">0</span> звёзд</div>
    </div>

    <div class="card">
        <h3>📅 Твой лимит на сегодня:</h3>
        <p><span id="limits">3 / 3</span> рецептов доступно</p>
        <button class="btn" id="sub-btn" style="background-color: #e53935;">⚡ Оформить Х2 подписку (6 рецептов)</button>
    </div>

    <div class="card">
        <h3>📸 Начать готовку:</h3>
        <p>Сфоткай холодильник, чтобы получить рецепт</p>
        <button class="btn" id="photo-btn">📷 Сделать фото</button>
    </div>

    <script>
        // Инициализируем Telegram Web App
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем приложение на весь экран

        // Берем имя пользователя прямо из его Telegram-аккаунта!
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('username').innerText = tg.initDataUnsafe.user.first_name;
        }

        // Кнопка подписки (пока просто показывает уведомление)
        document.getElementById('sub-btn').addEventListener('click', () => {
            tg.showAlert('Тут будет оплата через Telegram Stars! Подписка умножит лимит на 2.');
        });

        // Кнопка фото
        document.getElementById('photo-btn').addEventListener('click', () => {
            tg.showAlert('Здесь откроется камера для снимка холодильника.');
        });
    </script>
</body>
</html>
